name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.11.2"
            requirements: requirements_dev.txt
          - core: "2026.9.4-production-compat"
            requirements: requirements_compat.txt
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@de938e707d6c238b34e29b5770a011e3155e2a3c
        with:
          version: "0.13.9" # Includes the GHSA-hq85-5cpj-mr62 fix (>=0.13.4).
          require-checksums: true
          # GitHub release digest for the ubuntu-latest x86_64 Linux archive.
          checksum: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"

      - name: Set up Python
        run: uv python install 3.14

      - name: Create environment
        run: uv venv .venv --python 3.14

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r "${{ matrix.requirements }}"

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy custom_components/virtual_hvac

      - name: Tests
        run: PYTHONPATH=. .venv/bin/pytest --cov --cov-report=term-missing --cov-report=xml

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

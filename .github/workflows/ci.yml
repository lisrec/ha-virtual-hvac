name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5ec49509d70659645262a4de30e9f261902d34a7 # v6

      - name: Set up Python
        run: uv python install 3.14

      - name: Create environment
        run: uv venv .venv --python 3.14

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -r requirements_dev.txt

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy custom_components/virtual_hvac

      - name: Tests
        run: PYTHONPATH=. .venv/bin/pytest --cov --cov-report=term-missing --cov-report=xml

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # v2

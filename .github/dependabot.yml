version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 3 * * *"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: cron
      cronjob: "0 3 * * *"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
